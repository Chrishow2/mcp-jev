[project]
name = "mcp-jev"
version = "0.1.0"
description = "MCP server exposing TypeSafe Jev structured decisions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_jev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
